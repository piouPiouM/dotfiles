# PATH for the graphical session (niri -> noctalia), which never reads zsh rc files.
# Needed by noctalia plugins that look up tools on PATH (herdr via mise, gh via brew, fzf).
# 991- prefix: must sort after /etc/environment.d/99-environment.conf, which resets PATH.
# brew/fzf appended, not prepended: brew must not shadow system binaries.
PATH=${HOME}/.local/share/mise/shims:${PATH}:/home/linuxbrew/.linuxbrew/bin:${HOME}/.config/fzf/bin
