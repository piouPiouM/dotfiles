[plugin]
  prepend_previewers = [
    { url = "*.csv", run = "rich-preview" },
    { url = "*.md", run = "rich-preview" },
    { url = "*.rst", run = "rich-preview" },
    { url = "*.ipynb", run = "rich-preview" },
    { url = "*.json", run = "rich-preview" },
    { url = "*.lua", run = "rich-preview" },
  ]

[preview]
  max_width  = 1500
  max_height = 1000